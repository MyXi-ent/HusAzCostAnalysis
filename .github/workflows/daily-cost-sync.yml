name: Daily Cost Sync

on:
  schedule:
    # Run at 03:00 UTC daily (06:00 KSA)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync (default 5, max 30)'
        required: false
        default: '5'
      backfill_start:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
      backfill_end:
        description: 'Backfill end date (YYYY-MM-DD). Required if backfill_start is set.'
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cost-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # One subscription per job, run one at a time. The Cost Management API
    # throttles aggressively and answers 429 with `Retry-After: 60`, so the
    # calls have to be spread out rather than issued back to back.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        subscription:
          - Xi_Sponsored_Subscription_NEW

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get ARM access token
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ARM_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Sync ${{ matrix.subscription }}
        env:
          ARM_SUBSCRIPTIONS: '[{"name":"Xi_Sponsored_Subscription_NEW","id":"${{ vars.AZURE_SUBSCRIPTION_ID }}"}]'
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          SUBSCRIPTION: ${{ matrix.subscription }}
          BACKFILL_START: ${{ inputs.backfill_start }}
          BACKFILL_END: ${{ inputs.backfill_end }}
          DAYS: ${{ inputs.days || '5' }}
        run: |
          set -euo pipefail
          if [ -n "$BACKFILL_START" ] && [ -n "$BACKFILL_END" ]; then
            node scripts/sync-costs.js --subscription "$SUBSCRIPTION" \
              --start "$BACKFILL_START" --end "$BACKFILL_END"
          else
            node scripts/sync-costs.js --subscription "$SUBSCRIPTION" --days "$DAYS"
          fi
