name: Daily Cost Sync

on:
  schedule:
    # Run at 03:00 UTC daily (06:00 KSA)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync (default 5, max 30)'
        required: false
        default: '5'
      backfill_start:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
      backfill_end:
        description: 'Backfill end date (YYYY-MM-DD). Required if backfill_start is set.'
        required: false

concurrency:
  group: cost-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # One subscription per job, run one at a time. The Cost Management API
    # throttles aggressively and answers 429 with `Retry-After: 60`, so the
    # calls have to be spread out rather than issued back to back.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        subscription:
          - Xi_Sponsored_Subscription
          - Xi_Sponsored_2
          - Xi_Sponsored_3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync ${{ matrix.subscription }}
        env:
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTIONS: ${{ secrets.ARM_SUBSCRIPTIONS }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          SUBSCRIPTION: ${{ matrix.subscription }}
          BACKFILL_START: ${{ inputs.backfill_start }}
          BACKFILL_END: ${{ inputs.backfill_end }}
          DAYS: ${{ inputs.days || '5' }}
        run: |
          set -euo pipefail
          if [ -n "$BACKFILL_START" ] && [ -n "$BACKFILL_END" ]; then
            node scripts/sync-costs.js --subscription "$SUBSCRIPTION" \
              --start "$BACKFILL_START" --end "$BACKFILL_END"
          else
            node scripts/sync-costs.js --subscription "$SUBSCRIPTION" --days "$DAYS"
          fi
