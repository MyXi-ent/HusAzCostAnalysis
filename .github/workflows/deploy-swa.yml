name: Deploy to Xi Static Web App

# Manual deployment to the Xi Static Web App using GitHub OIDC (no stored deployment token).
# Add a push trigger once the repository content has been verified against the running app.
# Required repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SWA_NAME: swa-costanalysis-prd-eus2-001
  SWA_RESOURCE_GROUP: rg-xiweb-prd-eus-001

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$SWA_RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: "/"
          api_location: "api"
          output_location: ""
          skip_app_build: true
